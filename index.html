<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>개인 Google Drive 동기화</title></head><body><main><h1>개인 Google Drive 동기화</h1><p>이 도구는 개인이 자신의 컴퓨터와 Google Drive 사이에서 파일을 동기화하기 위해 rclone을 사용하는 설정입니다. Google 계정의 승인에 따라 선택한 폴더의 파일을 읽고, 만들고, 수정하거나 삭제할 수 있습니다.</p><p>개인 사용을 위한 도구이며 별도의 사용자 가입 서비스가 아닙니다.</p><p><a href="privacy.html">개인정보처리방침</a> · <a href="https://github.com/anon7734/drive-sync-info/issues">문의</a></p></main></body></html>
